volumes:
  data:
  db:

services:
  mariadb:
    image: mariadb:11.8
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --default-time-zone=America/New_York
    volumes:
      - ./db:/var/lib/mysql
    environment:
      - MYSQL_PASSWORD=zmpass
      - MYSQL_DATABASE=zm
      - MYSQL_USER=zmuser
      - MARIADB_ROOT_PASSWORD=w8t67u23789t
  zm:
    image: ghcr.io/jantman/docker-zoneminder:latest
    restart: always
    shm_size: 1G
    ports:
      - 8080:80
      - 9000:9000
      - 1984:1984
      - 8555:8555
    depends_on:
      - mariadb
    tmpfs:
      - /run
      - /tmp
    volumes:
      - ./cache:/var/cache/zoneminder
      - ./zm-log:/var/log/zm
      - ./apache2-log:/var/log/apache2
      - ./es_rules.yml:/etc/zm/es_rules.yml
      - ./secrets.yml:/etc/zm/secrets.yml
      - ./zmeventnotification.yml:/etc/zm/zmeventnotification.yml
      - ./objectconfig.yml:/etc/zm/objectconfig.yml
